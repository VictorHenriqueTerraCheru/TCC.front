<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f2f2f7" />
    <script>
      ;(function () {
        var preference = 'system'
        try {
          var saved = JSON.parse(localStorage.getItem('urbanReports.theme'))
          if (saved && saved.state && saved.state.preference) preference = saved.state.preference
        } catch (e) {}
        var dark =
          preference === 'dark' ||
          (preference === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        if (dark) document.querySelector('meta[name="theme-color"]').content = '#121a24'
      })()
    </script>
    <meta name="apple-mobile-web-app-title" content="Zela" />
    <meta name="description" content="Registro e validação colaborativa de ocorrências urbanas." />
    <title>Zela</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
