<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- "Adicionar à tela inicial"; sem service worker (offline está fora do escopo). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f2f2f7" />
    <script>
      // Tema antes da primeira pintura, para não piscar claro → escuro. Mesma regra de useTema
      // (src/common/hooks/use-tema.ts): a preferência salva ou, no automático, a do sistema.
      ;(function () {
        var preferencia = 'automatico'
        try {
          var salvo = JSON.parse(localStorage.getItem('ocorrencias.tema'))
          if (salvo && salvo.state && salvo.state.preferencia) preferencia = salvo.state.preferencia
        } catch (e) {}
        var escuro =
          preferencia === 'escuro' ||
          (preferencia === 'automatico' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.tema = escuro ? 'escuro' : 'claro'
        if (escuro) document.querySelector('meta[name="theme-color"]').content = '#121a24'
      })()
    </script>
    <meta name="apple-mobile-web-app-title" content="Ocorrências" />
    <meta name="description" content="Registro e validação colaborativa de ocorrências urbanas." />
    <title>Ocorrências urbanas</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
